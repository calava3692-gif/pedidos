<script>
    // ==========================================
    // CONFIGURACIÓN: URL DEL SCRIPT DE GOOGLE
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytHjsAF6wlmcbEzRIDO6D6i7RSe--B7VU5_w9wuPIQ9uZiNAtCkw_dkulzigpbo1-GEQ/exec"; 

    document.addEventListener("DOMContentLoaded", () => {
      cargarPendientes();
    });

    function limpiarFormulario() {
      document.getElementById('usuario-val').value = '';
      document.getElementById('fecha-val').value = '';
      const estadoBadge = document.getElementById('estado-badge');
      estadoBadge.textContent = '---';
      estadoBadge.style.color = '#8b9dad';
      estadoBadge.style.background = 'rgba(255, 255, 255, 0.1)';
    }

    /**
     * Llama al endpoint POST enviando el usuario logueado para listar sus pendientes
     */
    async function cargarPendientes() {
      const select = document.getElementById('solicitud-select'); // Faltaba definir el select
      select.innerHTML = '<option>Cargando...</option>';
      
      try {
        // 1. Obtener usuario de localStorage
        const usuarioStorage = localStorage.getItem('sesionPWA');
        if (!usuarioStorage) {
            alert("No hay sesión activa. Por favor inicia sesión.");
            return;
        }
        const usuario = JSON.parse(usuarioStorage);

        // 2. Preparar los datos a enviar
        const payload = JSON.stringify({ 
          action: "listarPendientes",
          username: usuario.username 
        });

        // 3. Hacer la petición al servidor
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: payload,
          redirect: "follow"
        });
        
        const idsPendientes = await response.json();
        
        // 4. Renderizar la lista
        select.innerHTML = ''; 
        
        if (!idsPendientes || idsPendientes.length === 0 || idsPendientes.error) {
          select.innerHTML = '<option value="">No hay pedidos pendientes</option>';
          document.getElementById('items-body').innerHTML = '<tr><td colspan="4" style="text-align: center;">No hay información que mostrar</td></tr>';
          document.getElementById('btn-autorizar').disabled = true;
          return;
        }

        idsPendientes.forEach(id => {
          let opt = document.createElement('option');
          opt.value = id;
          opt.textContent = id;
          select.appendChild(opt);
        });

        document.getElementById('btn-autorizar').disabled = false;
        await cargarSolicitud();

      } catch (error) {
        alert("Error al conectar con Google Sheets: " + error.message);
        select.innerHTML = '<option value="">Error de conexión</option>';
      }
    }

    /**
     * Llama al endpoint GET ?action=obtenerPedido&id=XYZ
     */
    async function cargarSolicitud() {
      const idSeleccionado = document.getElementById('solicitud-select').value;
      if (!idSeleccionado) {
        limpiarFormulario();
        return;
      }

      const estadoBadge = document.getElementById('estado-badge');
      const tbody = document.getElementById('items-body');

      estadoBadge.textContent = "Cargando...";
      estadoBadge.style.background = "rgba(255, 255, 255, 0.1)";
      estadoBadge.style.color = "#8b9dad";
      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Obteniendo datos de la solicitud...</td></tr>';
      
      try {
        const response = await fetch(SCRIPT_URL + "?action=obtenerPedido&id=" + idSeleccionado + "&t=" + Date.now());
        const data = await response.json();

        if (data.error) {
          alert("Error desde el servidor: " + data.error);
          return;
        }

        document.getElementById('usuario-val').value = data.usuario || 'N/A';
        document.getElementById('fecha-val').value = data.fecha || 'N/A'; 

        estadoBadge.textContent = "Pendiente";
        estadoBadge.style.color = "#ffb74d";
        estadoBadge.style.background = "rgba(255, 183, 77, 0.2)";

        tbody.innerHTML = '';
        if (data.items && data.items.length > 0) {
          data.items.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${item.codigo}</td>
              <td>${item.detalle}</td>
              <td style="text-align: center;">${item.solicitado}</td>
              <td style="text-align: center;">
                <input type="number" class="input-qty" data-codigo="${item.codigo}" value="${item.solicitado}" min="0">
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Sin productos en esta solicitud</td></tr>';
        }

      } catch (error) {
        alert("Error al cargar la solicitud: " + error.message);
      }
    }

    /**
     * Envía la autorización al endpoint POST
     */
    async function autorizarPedido() {
      const idSeleccionado = document.getElementById('solicitud-select').value;
      if (!idSeleccionado) return;

      const btn = document.getElementById('btn-autorizar');
      const textOriginal = btn.innerHTML;
      btn.innerHTML = '<span>⏳</span><span>Procesando...</span>';
      btn.disabled = true;

      const inputs = document.querySelectorAll('.input-qty');
      const itemsAutorizados = [];
      
      inputs.forEach(input => {
        itemsAutorizados.push({
          codigo: input.getAttribute('data-codigo'),
          cantidad: input.value
        });
      });

      const payload = {
        action: "procesarAutorizacion", // Agregado por seguridad para tu nueva API
        id: idSeleccionado,
        items: itemsAutorizados
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: {
            'Content-Type': 'text/plain;charset=utf-8' 
          }
        });

        const result = await response.json();

        if (result.success) {
          alert(result.message);
          await cargarPendientes();
        } else {
          alert("Error: " + result.message);
        }

      } catch (error) {
        alert("Error de conexión al autorizar: " + error.message);
      } finally {
        btn.innerHTML = textOriginal;
        btn.disabled = false;
      }
    }

    function volverMenu() {
      window.history.back();
    }
  </script>
