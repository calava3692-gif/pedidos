<!DOCTYPE html>
<html lang="es">
<head>
    <script>
    // Validar sesión iniciada
    (function comprobarSesion() {
        const usuario = localStorage.getItem('usuarioLogueado');
        if (!usuario) {
            window.location.href = 'index.html';
        }
    })();
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envío de Devoluciones a Bodega</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d2a;
            --card-inner-bg: #0f1623;
            --input-bg: #0b101b;
            --border-color: #232f45;
            --text-main: #e2e8f0;
            --text-muted: #8a99ad;
            --btn-primary: #1d4ed8;
            --btn-primary-hover: #2563eb;
            --btn-success: #15803d;
            --btn-success-hover: #16a34a;
            --btn-secondary: #243246;
            --accent-blue: #38bdf8;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 18px 18px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Panel de Control */
        .control-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .control-header h2 {
            margin: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .email-form {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background-color: var(--card-inner-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.flex-grow {
            flex-grow: 1;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-send {
            background-color: var(--btn-success);
            color: white;
        }

        .btn-send:hover {
            background-color: var(--btn-success-hover);
        }

        .btn-back {
            background-color: var(--btn-secondary);
            color: var(--text-main);
            text-decoration: none;
        }

        /* Estilos del Documento Oficial Estilo Excel */
        .paper-wrapper {
            background-color: #ffffff;
            color: #000000;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow-x: auto;
        }

        .doc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            font-family: Arial, sans-serif;
            margin-top: 10px;
        }

        .doc-table td, .doc-table th {
            border: 1px solid #000000;
            padding: 3px 4px;
            text-align: center;
            height: 22px;
            vertical-align: middle;
            word-break: break-word;
        }

        .logo-title-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .bg-gray-header {
            background-color: #d9d9d9;
            font-weight: bold;
            font-size: 11px;
        }

        .status-msg {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel superior -->
        <div class="control-card">
            <div class="control-header">
                <h2><i class="fas fa-paper-plane" style="color: var(--accent-blue);"></i> Enviar Correos Devoluciones</h2>
                <a href="dashboard.html" class="btn btn-back"><i class="fas fa-arrow-left"></i> Volver al Menú</a>
            </div>

            <div class="email-form">
                <!-- Combobox de Formatos/Documentos -->
                <div class="form-group" style="min-width: 240px;">
                    <label for="cmbFormato">DOCUMENTO / FORMATO:</label>
                    <select id="cmbFormato" class="form-control" onchange="cargarFormatoSeleccionado()">
                        <option value="">Cargando lista...</option>
                    </select>
                </div>

                <!-- Input de Destinatarios -->
                <div class="form-group flex-grow">
                    <label for="txtDestinatarios">Direcciones de correo de destino (separadas por coma):</label>
                    <input type="text" id="txtDestinatarios" class="form-control" value="bodega@telconet.ec, calava@telconet.ec">
                </div>

                <!-- Botón de Envío -->
                <button class="btn btn-send" id="btnEnviar" onclick="enviarCorreo()">
                    <i class="fas fa-file-excel"></i> Enviar Formato Excel por Correo
                </button>
            </div>
        </div>

        <!-- Documento de Visualización -->
        <div class="paper-wrapper" id="paperContainer">
            <div class="status-msg"><i class="fas fa-spinner fa-spin"></i> Cargando vista previa del formato...</div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxJmtoTOULHHnbKTJDSk2cSwZtQRur-_fwH8jGVRbutl_qlP4ZtRjguIujsYNtnv-YVmw/exec';
        const usuarioLogueado = localStorage.getItem('usuarioLogueado') || 'calava';

        document.addEventListener('DOMContentLoaded', () => {
            cargarListaFormatos();
        });

        function cargarListaFormatos() {
            const cmb = document.getElementById('cmbFormato');

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ action: 'getListaFormatosDevolucion' }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success' && data.formatos && data.formatos.length > 0) {
                    cmb.innerHTML = '';
                    let seleccionadoPorDefecto = '';

                    data.formatos.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.nombreHoja;
                        option.textContent = `${item.nombreHoja} (${item.usuario})`;
                        cmb.appendChild(option);

                        if (item.usuario.toLowerCase() === usuarioLogueado.toLowerCase() || item.nombreHoja === 'FORMATO_' + usuarioLogueado) {
                            seleccionadoPorDefecto = item.nombreHoja;
                        }
                    });

                    if (seleccionadoPorDefecto) {
                        cmb.value = seleccionadoPorDefecto;
                    }

                    cargarFormatoSeleccionado();
                } else {
                    cmb.innerHTML = `<option value="FORMATO_${usuarioLogueado}">FORMATO_${usuarioLogueado}</option>`;
                    cargarFormatoSeleccionado();
                }
            })
            .catch(err => {
                console.error('Error al cargar lista de formatos:', err);
                cmb.innerHTML = `<option value="FORMATO_${usuarioLogueado}">FORMATO_${usuarioLogueado}</option>`;
                cargarFormatoSeleccionado();
            });
        }

        function cargarFormatoSeleccionado() {
            const paper = document.getElementById('paperContainer');
            const formatoSel = document.getElementById('cmbFormato').value || ('FORMATO_' + usuarioLogueado);

            paper.innerHTML = '<div class="status-msg"><i class="fas fa-spinner fa-spin"></i> Cargando vista previa del formato...</div>';

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'getFormatoDevolucion',
                    formatoSeleccionado: formatoSel,
                    usuarioLogueado: usuarioLogueado
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    renderizarDocumento(data.metadata, data.items);
                } else {
                    paper.innerHTML = `<div class="status-msg" style="color: #ef4444;"><i class="fas fa-exclamation-circle"></i> ${data.message}</div>`;
                }
            })
            .catch(err => {
                console.error(err);
                paper.innerHTML = `<div class="status-msg" style="color: #ef4444;"><i class="fas fa-exclamation-circle"></i> Error al conectar con el servidor.</div>`;
            });
        }

        function renderizarDocumento(meta, items) {
            const paper = document.getElementById('paperContainer');
            const metaData = meta || {};
            const itemsList = items || [];

            // Mantener al menos 10 filas visibles para simular la cuadrícula de Excel vacía
            const totalFilas = Math.max(itemsList.length, 10);
            let rowsHTML = '';

            for (let i = 0; i < totalFilas; i++) {
                const item = itemsList[i] || {};
                
                const tarea = item.tarea || item.Tarea || '';
                const login = item.login || item.Login || '';
                const tecnico = item.tecnico || item.Tecnico || '';
                const modelo = item.modelo || item.Modelo || '';
                const serie = item.serie || item.Serie || '';
                const punta_ini = item.punta_ini || item.inicial || item.Inicial || '';
                const punta_fin = item.punta_fin || item.final || item.Final || '';
                const serieAuto = item.serieAuto || item.serie_automatica || item.Serie_Automatica || '';
                const estado = item.estado || item.Estado || '';
                const usuario = item.usuario || item.Usuario || '';
                const devCant = item.devCant || item.devolucion || item.Devolucion || item.cant || '';

                // Estructura exacta de 12 columnas (A a la L)
                rowsHTML += `
                    <tr>
                        <td style="width: 2%;"></td> <!-- Columna A (vacía) -->
                        <td style="width: 8%;">${tarea}</td> <!-- Columna B: Tarea -->
                        <td style="width: 9%;">${login}</td> <!-- Columna C: Login -->
                        <td style="width: 18%;">${tecnico}</td> <!-- Columna D: Técnico -->
                        <td style="width: 9%;">${modelo}</td> <!-- Columna E: Modelo -->
                        <td style="width: 9%;">${serie}</td> <!-- Columna F: Serie -->
                        <td style="width: 5%;">${punta_ini}</td> <!-- Columna G: Puntas Inicial -->
                        <td style="width: 5%;">${punta_fin}</td> <!-- Columna H: Puntas Final -->
                        <td style="width: 10%;">${serieAuto}</td> <!-- Columna I: Serie Automática -->
                        <td style="width: 7%;">${estado}</td> <!-- Columna J: Estado -->
                        <td style="width: 6%;">${usuario}</td> <!-- Columna K: Usuario -->
                        <td style="width: 8%;">${devCant}</td> <!-- Columna L: Devolución (Cant.) -->
                    </tr>
                `;
            }

            paper.innerHTML = `
                <!-- Cabecera con Logo y Título de Documento -->
                <div class="logo-title-container">
                    <div style="width: 180px;">
                        <svg width="170" height="40" viewBox="0 0 170 40">
                            <!-- Logo SVG Telconet -->
                            <ellipse cx="60" cy="20" rx="55" ry="16" fill="none" stroke="#003366" stroke-width="2.5" transform="rotate(-8 60 20)" />
                            <ellipse cx="60" cy="20" rx="45" ry="10" fill="none" stroke="#38bdf8" stroke-width="1.8" transform="rotate(-8 60 20)" />
                            <text x="20" y="25" font-family="Arial, sans-serif" font-weight="900" font-style="italic" font-size="20" fill="#003366">telconet</text>
                            <text x="28" y="34" font-family="Arial, sans-serif" font-style="italic" font-size="7.5" fill="#555555">la fibra del Ecuador!</text>
                        </svg>
                    </div>
                    <div style="text-align: center; flex-grow: 1;">
                        <div style="font-size: 18px; font-weight: bold; font-family: Arial, sans-serif;">Solicitud/Devolución a Bodega</div>
                        <div style="font-size: 15px; font-weight: bold; font-family: Arial, sans-serif; margin-top: 2px;">FOR BOD 01 Ver 21 05 13</div>
                    </div>
                    <div style="width: 180px;"></div>
                </div>

                <!-- Tabla Principal estilo Excel (12 columnas en total) -->
                <table class="doc-table">
                    <!-- Fila 1: SOLICITUD / DEVOLUCION / X -->
                    <tr>
                        <td style="width: 2%;"></td> <!-- Columna A -->
                        <td colspan="2" class="bg-gray-header">SOLICITUD</td> <!-- Cols B, C -->
                        <td colspan="6"></td> <!-- Cols D, E, F, G, H, I -->
                        <td colspan="2" class="bg-gray-header">DEVOLUCION</td> <!-- Cols J, K -->
                        <td class="bg-gray-header" style="font-weight: bold; text-align: center;">x</td> <!-- Col L -->
                    </tr>

                    <!-- Fila 2: Encabezados de Metadatos -->
                    <tr class="bg-gray-header">
                        <td></td> <!-- Col A -->
                        <td>Fecha de Solicitud</td> <!-- Col B -->
                        <td>Solicitado por:</td> <!-- Col C -->
                        <td colspan="3">Autorizado por:</td> <!-- Cols D, E, F -->
                        <td colspan="3">Recibido por:</td> <!-- Cols G, H, I -->
                        <td colspan="2">Departamento/División</td> <!-- Cols J, K -->
                        <td>Fecha de Entrega</td> <!-- Col L -->
                    </tr>

                    <!-- Fila 3: Valores de Metadatos -->
                    <tr>
                        <td></td> <!-- Col A -->
                        <td><b>${metaData.fechaSolicitud || ''}</b></td> <!-- Col B -->
                        <td style="font-size: 10px;">${metaData.solicitadoPor || ''}</td> <!-- Col C -->
                        <td colspan="3" style="font-size: 10px;"><b>${metaData.autorizadoPor || ''}</b></td> <!-- Cols D, E, F -->
                        <td colspan="3" style="font-size: 10px;">${metaData.recibidoPor || ''}</td> <!-- Cols G, H, I -->
                        <td colspan="2"><b>${metaData.departamento || 'OPU'}</b></td> <!-- Cols J, K -->
                        <td>${metaData.fechaEntrega || ''}</td> <!-- Col L -->
                    </tr>

                    <!-- Fila 4 y 5: Encabezados de Ítems -->
                    <tr class="bg-gray-header">
                        <td rowspan="2"></td> <!-- Col A -->
                        <td rowspan="2">Tarea</td> <!-- Col B -->
                        <td rowspan="2">Login</td> <!-- Col C -->
                        <td rowspan="2">Técnico</td> <!-- Col D -->
                        <td rowspan="2">Modelo</td> <!-- Col E -->
                        <td rowspan="2">Serie</td> <!-- Col F -->
                        <td colspan="2">Puntas</td> <!-- Cols G, H -->
                        <td rowspan="2">Serie Automatica</td> <!-- Col I -->
                        <td rowspan="2">Estado</td> <!-- Col J -->
                        <td rowspan="2">Usuario</td> <!-- Col K -->
                        <td rowspan="2">Devolución (Cant.)</td> <!-- Col L -->
                    </tr>
                    <tr class="bg-gray-header">
                        <td>Inicial</td> <!-- Col G -->
                        <td>Final</td> <!-- Col H -->
                    </tr>

                    <!-- Filas de Datos de Ítems (12 columnas exactas) -->
                    ${rowsHTML}
                </table>
            `;
        }

        function enviarCorreo() {
            const destinatarios = document.getElementById('txtDestinatarios').value.trim();
            const formatoSel = document.getElementById('cmbFormato').value;
            const btn = document.getElementById('btnEnviar');

            if (!destinatarios) {
                alert('Por favor, ingresa al menos un correo de destino.');
                return;
            }

            if (!formatoSel) {
                alert('Por favor, selecciona un documento/formato.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generando Excel y enviando...';

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'enviarCorreoDevolucion',
                    formatoSeleccionado: formatoSel,
                    usuarioLogueado: usuarioLogueado,
                    destinatarios: destinatarios
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('✅ ' + data.message);
                } else {
                    alert('❌ Error: ' + data.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert('Ocurrió un error al intentar enviar el correo.');
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-file-excel"></i> Enviar Formato Excel por Correo';
            });
        }
    </script>
</body>
</html>
