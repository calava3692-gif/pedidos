<!DOCTYPE html>
<html lang="es">
<head>
    <script>
    // Validar sesión iniciada
    (function comprobarSesion() {
        const usuario = localStorage.getItem('usuarioLogueado');
        if (!usuario) {
            window.location.href = 'index.html';
        }
    })();
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envío de Devoluciones a Bodega</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d2a;
            --card-inner-bg: #0f1623;
            --input-bg: #0b101b;
            --border-color: #232f45;
            --text-main: #e2e8f0;
            --text-muted: #8a99ad;
            --btn-primary: #1d4ed8;
            --btn-primary-hover: #2563eb;
            --btn-success: #15803d;
            --btn-success-hover: #16a34a;
            --btn-secondary: #243246;
            --accent-blue: #38bdf8;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 18px 18px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Panel de Control */
        .control-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .control-header h2 {
            margin: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .email-form {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background-color: var(--card-inner-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.flex-grow {
            flex-grow: 1;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-send {
            background-color: var(--btn-success);
            color: white;
        }

        .btn-send:hover {
            background-color: var(--btn-success-hover);
        }

        .btn-back {
            background-color: var(--btn-secondary);
            color: var(--text-main);
            text-decoration: none;
        }

        /* Estilos de Documento / Papel Oficial */
        .paper-wrapper {
            background-color: #ffffff;
            color: #000000;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow-x: auto;
        }

        .doc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            font-family: Arial, sans-serif;
            margin-top: 10px;
        }

        .doc-table td, .doc-table th {
            border: 1px solid #000000;
            padding: 5px 6px;
            text-align: center;
        }

        .logo-title-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .brand-logo {
            font-weight: 900;
            font-size: 26px;
            font-style: italic;
            color: #003366;
            line-height: 1;
        }

        .brand-sub {
            font-size: 9px;
            color: #555;
            font-style: normal;
        }

        .doc-main-title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            flex-grow: 1;
        }

        .doc-sub-code {
            font-size: 10px;
            text-align: center;
            color: #333;
        }

        .bg-gray-header {
            background-color: #e5e7eb;
            font-weight: bold;
        }

        .status-msg {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Panel superior -->
        <div class="control-card">
            <div class="control-header">
                <h2><i class="fas fa-paper-plane" style="color: var(--accent-blue);"></i> Enviar Correos Devoluciones</h2>
                <a href="dashboard.html" class="btn btn-back"><i class="fas fa-arrow-left"></i> Volver al Menú</a>
            </div>

            <div class="email-form">
                <!-- Combobox de Formatos/Documentos -->
                <div class="form-group" style="min-width: 240px;">
                    <label for="cmbFormato">DOCUMENTO / FORMATO:</label>
                    <select id="cmbFormato" class="form-control" onchange="cargarFormatoSeleccionado()">
                        <option value="">Cargando lista...</option>
                    </select>
                </div>

                <!-- Input de Destinatarios -->
                <div class="form-group flex-grow">
                    <label for="txtDestinatarios">Direcciones de correo de destino (separadas por coma):</label>
                    <input type="text" id="txtDestinatarios" class="form-control" value="bodega@telconet.ec, coordinacion@telconet.ec">
                </div>

                <!-- Botón de Envío -->
                <button class="btn btn-send" id="btnEnviar" onclick="enviarCorreo()">
                    <i class="fas fa-file-excel"></i> Enviar Formato Excel por Correo
                </button>
            </div>
        </div>

        <!-- Documento de Visualización -->
        <div class="paper-wrapper" id="paperContainer">
            <div class="status-msg"><i class="fas fa-spinner fa-spin"></i> Cargando vista previa del formato...</div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxJmtoTOULHHnbKTJDSk2cSwZtQRur-_fwH8jGVRbutl_qlP4ZtRjguIujsYNtnv-YVmw/exec';
        const usuarioLogueado = localStorage.getItem('usuarioLogueado') || 'calava';

        document.addEventListener('DOMContentLoaded', () => {
            cargarListaFormatos();
        });

        function cargarListaFormatos() {
            const cmb = document.getElementById('cmbFormato');

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ action: 'getListaFormatosDevolucion' }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success' && data.formatos && data.formatos.length > 0) {
                    cmb.innerHTML = '';
                    let seleccionadoPorDefecto = '';

                    data.formatos.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.nombreHoja;
                        option.textContent = `${item.nombreHoja} (${item.usuario})`;
                        cmb.appendChild(option);

                        if (item.usuario.toLowerCase() === usuarioLogueado.toLowerCase() || item.nombreHoja === 'FORMATO_' + usuarioLogueado) {
                            seleccionadoPorDefecto = item.nombreHoja;
                        }
                    });

                    if (seleccionadoPorDefecto) {
                        cmb.value = seleccionadoPorDefecto;
                    }

                    cargarFormatoSeleccionado();
                } else {
                    cmb.innerHTML = `<option value="FORMATO_${usuarioLogueado}">FORMATO_${usuarioLogueado}</option>`;
                    cargarFormatoSeleccionado();
                }
            })
            .catch(err => {
                console.error('Error al cargar lista de formatos:', err);
                cmb.innerHTML = `<option value="FORMATO_${usuarioLogueado}">FORMATO_${usuarioLogueado}</option>`;
                cargarFormatoSeleccionado();
            });
        }

        function cargarFormatoSeleccionado() {
            const paper = document.getElementById('paperContainer');
            const formatoSel = document.getElementById('cmbFormato').value || ('FORMATO_' + usuarioLogueado);

            paper.innerHTML = '<div class="status-msg"><i class="fas fa-spinner fa-spin"></i> Cargando vista previa del formato...</div>';

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'getFormatoDevolucion',
                    formatoSeleccionado: formatoSel,
                    usuarioLogueado: usuarioLogueado
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    renderizarDocumento(data.metadata, data.items);
                } else {
                    paper.innerHTML = `<div class="status-msg" style="color: #ef4444;"><i class="fas fa-exclamation-circle"></i> ${data.message}</div>`;
                }
            })
            .catch(err => {
                console.error(err);
                paper.innerHTML = `<div class="status-msg" style="color: #ef4444;"><i class="fas fa-exclamation-circle"></i> Error al conectar con el servidor.</div>`;
            });
        }

        function renderizarDocumento(meta, items) {
            const paper = document.getElementById('paperContainer');

            let rowsHTML = '';
            const totalFilas = Math.max(items.length, 8);

            for (let i = 0; i < totalFilas; i++) {
                const item = items[i] || {};
                
                const tarea = item.tarea || item.Tarea || '';
                const login = item.login || item.Login || '';
                const tecnico = item.tecnico || item.Tecnico || '';
                const modelo = item.modelo || item.Modelo || '';
                const serie = item.serie || item.Serie || '';
                const punta_ini = item.punta_ini || item.inicial || item.Inicial || '';
                const punta_fin = item.punta_fin || item.final || item.Final || '';
                const serieAuto = item.serieAuto || item.serie_automatica || item.Serie_Automatica || '';
                const estado = item.estado || item.Estado || '';
                const usuario = item.usuario || item.Usuario || '';
                const devCant = item.devCant || item.devolucion || item.Devolucion || item.cant || '';

                rowsHTML += `
                    <tr>
                        <td style="width: 20px; background-color: #f9fafb; border: 1px solid #000;"></td> <!-- Columna A (Margen) -->
                        <td style="height: 24px;">${tarea}</td> <!-- B -->
                        <td>${login}</td> <!-- C -->
                        <td>${tecnico}</td> <!-- D -->
                        <td>${modelo}</td> <!-- E -->
                        <td>${serie}</td> <!-- F -->
                        <td>${punta_ini}</td> <!-- G -->
                        <td>${punta_fin}</td> <!-- H -->
                        <td>${serieAuto}</td> <!-- I -->
                        <td>${estado}</td> <!-- J -->
                        <td>${usuario}</td> <!-- K -->
                        <td>${devCant}</td> <!-- L -->
                    </tr>
                `;
            }

            paper.innerHTML = `
                <div class="logo-title-container">
                    <div class="brand-logo">
                        telconet
                        <div class="brand-sub">la fibra del Ecuador</div>
                    </div>
                    <div style="text-align: center;">
                        <div class="doc-main-title">Solicitud/Devolución a Bodega</div>
                        <div class="doc-sub-code">FOR BOD 01 Ver. 21 05 13</div>
                    </div>
                    <div style="width: 120px;"></div>
                </div>

                <table class="doc-table">
                    <!-- Fila 6: Tipo (SOLICITUD / DEVOLUCION / X) -->
                    <tr>
                        <td style="background-color: #f9fafb; border: 1px solid #000;"></td>
                        <td colspan="5" class="bg-gray-header">SOLICITUD</td>
                        <td colspan="3" style="border: 1px solid #000;"></td>
                        <td colspan="2" class="bg-gray-header">DEVOLUCION</td>
                        <td style="font-weight: bold; background-color: #e5e7eb;">X</td>
                    </tr>

                    <!-- Fila 8: Metadatos de Cabecera (Etiquetas) -->
                    <tr class="bg-gray-header">
                        <td style="background-color: #f9fafb; border: 1px solid #000;"></td>
                        <td style="width: 9%;">Fecha de Solicitud</td>
                        <td style="width: 12%;">Solicitado por:</td>
                        <td colspan="3" style="width: 24%;">Autorizado por:</td>
                        <td colspan="3" style="width: 22%;">Recibido por:</td>
                        <td colspan="2" style="width: 16%;">Departamento/División</td>
                        <td style="width: 10%;">Fecha de Entrega</td>
                    </tr>

                    <!-- Fila 9: Datos de Cabecera (Valores) -->
                    <tr>
                        <td style="background-color: #f9fafb; border: 1px solid #000;"></td>
                        <td><b>${meta.fechaSolicitud || ''}</b></td>
                        <td>${meta.solicitadoPor || ''}</td>
                        <td colspan="3"><b>${meta.autorizadoPor || ''}</b></td>
                        <td colspan="3">${meta.recibidoPor || ''}</td>
                        <td colspan="2">${meta.departamento || 'OPU'}</td>
                        <td>${meta.fechaEntrega || ''}</td>
                    </tr>

                    <!-- Fila 10 y 11: Encabezados de la Tabla de Ítems -->
                    <tr class="bg-gray-header">
                        <td rowspan="2" style="background-color: #f9fafb; border: 1px solid #000;"></td>
                        <td rowspan="2" style="width: 8%;">Tarea</td>
                        <td rowspan="2" style="width: 10%;">Login</td>
                        <td rowspan="2" style="width: 16%;">Técnico</td>
                        <td rowspan="2" style="width: 9%;">Modelo</td>
                        <td rowspan="2" style="width: 10%;">Serie</td>
                        <td colspan="2">Puntas</td>
                        <td rowspan="2" style="width: 9%;">Serie Automatica</td>
                        <td rowspan="2" style="width: 6%;">Estado</td>
                        <td rowspan="2" style="width: 6%;">Usuario</td>
                        <td rowspan="2" style="width: 8%;">Devolución (Cant.)</td>
                    </tr>
                    <tr class="bg-gray-header">
                        <td style="width: 5%;">Inicial</td>
                        <td style="width: 5%;">Final</td>
                    </tr>

                    <!-- Filas de Datos -->
                    ${rowsHTML}
                </table>
            `;
        }
        function enviarCorreo() {
            const destinatarios = document.getElementById('txtDestinatarios').value.trim();
            const formatoSel = document.getElementById('cmbFormato').value;
            const btn = document.getElementById('btnEnviar');

            if (!destinatarios) {
                alert('Por favor, ingresa al menos un correo de destino.');
                return;
            }

            if (!formatoSel) {
                alert('Por favor, selecciona un documento/formato.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generando Excel y enviando...';

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'enviarCorreoDevolucion',
                    formatoSeleccionado: formatoSel,
                    usuarioLogueado: usuarioLogueado,
                    destinatarios: destinatarios
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('✅ ' + data.message);
                } else {
                    alert('❌ Error: ' + data.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert('Ocurrió un error al intentar enviar el correo.');
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-file-excel"></i> Enviar Formato Excel por Correo';
            });
        }
    </script>
</body>
</html>
