<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorización de Pedidos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d2a;
            --card-inner-bg: #0f1623;
            --input-bg: #0b101b;
            --border-color: #232f45;
            --text-main: #e2e8f0;
            --text-muted: #8a99ad;
            --btn-primary: #2d5b88;
            --btn-primary-hover: #3b73aa;
            --btn-secondary: #243246;
            --btn-secondary-hover: #31435e;
            --btn-danger: #8f2d2d;
            --btn-danger-hover: #b83a3a;
            --badge-pending-bg: #9a4b11;
            --badge-pending-text: #fef3c7;
            --accent-blue: #38bdf8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 18px 18px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 100%;
            max-width: 780px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            margin: 20px;
        }

        /* Encabezado */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-weight: 600;
        }

        .btn-refresh {
            background-color: var(--btn-secondary);
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background-color: var(--btn-secondary-hover);
            transform: rotate(90deg);
        }

        /* Bloque de filtros */
        .filter-section {
            background-color: var(--card-inner-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: var(--accent-blue);
        }

        select.form-control {
            cursor: pointer;
        }

        /* Insignia de Estado */
        .badge-pending {
            display: inline-block;
            background-color: var(--badge-pending-bg);
            color: var(--badge-pending-text);
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            width: fit-content;
        }

        /* Tabla de ítems */
        .table-container {
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table td {
            padding: 12px 10px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .input-authorized {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #ffffff;
            text-align: center;
            padding: 6px;
            border-radius: 6px;
            width: 65px;
            font-size: 14px;
        }

        .input-authorized:focus {
            border-color: var(--accent-blue);
        }

        .btn-sm-danger {
            background-color: var(--btn-danger);
            border: none;
            border-radius: 5px;
            padding: 6px 10px;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-sm-danger:hover {
            background-color: var(--btn-danger-hover);
        }

        /* Botones de acción principal */
        .actions-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-sizing: border-box;
            transition: background-color 0.2s ease;
        }

        .btn-autorizar {
            background-color: var(--btn-primary);
            color: #ffffff;
        }

        .btn-autorizar:hover {
            background-color: var(--btn-primary-hover);
        }

        .btn-anular {
            background-color: var(--btn-danger);
            color: #ffffff;
        }

        .btn-anular:hover {
            background-color: var(--btn-danger-hover);
        }

        .btn-volver {
            background-color: var(--btn-secondary);
            color: var(--text-main);
        }

        .btn-volver:hover {
            background-color: var(--btn-secondary-hover);
        }

        .empty-row {
            text-align: center;
            color: var(--text-muted);
            padding: 20px !important;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- Encabezado -->
        <div class="card-header">
            <h2>📦 Autorización de Pedidos</h2>
            <button class="btn-refresh" id="btnRefresh" title="Actualizar Datos" onclick="cargarPedidos()">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <!-- Filtros y Datos de la Solicitud -->
        <div class="filter-section">
            <div class="form-group">
                <label for="selectSolicitud">SOLICITUD (PENDIENTES):</label>
                <select id="selectSolicitud" class="form-control" onchange="mostrarDetalleSolicitud()">
                    <option value="">Cargando...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fechaConsulta">FECHA DE CONSULTA:</label>
                <input type="text" id="fechaConsulta" class="form-control" readonly placeholder="-">
            </div>

            <div class="form-group">
                <label for="usuarioTecnico">USUARIO (TÉCNICO):</label>
                <input type="text" id="usuarioTecnico" class="form-control" readonly value="-">
            </div>

            <div class="form-group">
                <label>ESTADO:</label>
                <div>
                    <span class="badge-pending" id="badgeEstado">Pendiente</span>
                </div>
            </div>
        </div>

        <!-- Tabla de Productos -->
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Detalle</th>
                        <th style="text-align: center;">Solicitado</th>
                        <th style="text-align: center;">Autorizado</th>
                        <th style="text-align: center;">Acción</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" class="empty-row">Selecciona una solicitud para ver el detalle</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Botones de Acción Principal -->
        <div class="actions-container">
            <button class="btn-action btn-autorizar" onclick="autorizarPedidoActual()">
                📝 Autorizar Pedido
            </button>
            <button class="btn-action btn-anular" onclick="anularPedidoActual()">
                🚫 Anular Pedido Completo
            </button>
            <a href="dashboard.html" class="btn-action btn-volver">
                ⬅️ Volver al Menú
            </a>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxJmtoTOULHHnbKTJDSk2cSwZtQRur-_fwH8jGVRbutl_qlP4ZtRjguIujsYNtnv-YVmw/exec'; 

        // Recuperar el identificador del usuario en sesión
        const usuarioCoordinador = localStorage.getItem('usuarioLogueado') || localStorage.getItem('userName') || localStorage.getItem('userEmail') || 'coordinador';

        let agrupadosPorSolicitud = {};

        document.addEventListener('DOMContentLoaded', cargarPedidos);

        function cargarPedidos() {
            const select = document.getElementById('selectSolicitud');
            select.innerHTML = '<option value="">Cargando...</option>';

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'getPedidosPendientes',
                    usuarioLogueado: usuarioCoordinador
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    procesarPedidos(data.pedidos);
                } else {
                    alert('Error del servidor: ' + data.message);
                }
            })
            .catch(err => {
                console.error(err);
                select.innerHTML = '<option value="">Error de conexión</option>';
            });
        }

        function procesarPedidos(pedidos) {
            agrupadosPorSolicitud = {};
            const select = document.getElementById('selectSolicitud');
            select.innerHTML = '';

            if (!pedidos || pedidos.length === 0) {
                select.innerHTML = '<option value="">Sin pendientes</option>';
                document.getElementById('usuarioTecnico').value = '-';
                document.getElementById('fechaConsulta').value = '-';
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="empty-row">No hay solicitudes pendientes asignadas</td></tr>';
                document.getElementById('badgeEstado').textContent = 'Al día';
                return;
            }

            pedidos.forEach(item => {
                const idSolicitud = item.solicitud || item.pedido;
                if (!agrupadosPorSolicitud[idSolicitud]) {
                    agrupadosPorSolicitud[idSolicitud] = [];
                }
                agrupadosPorSolicitud[idSolicitud].push(item);
            });

            Object.keys(agrupadosPorSolicitud).forEach(idSol => {
                const opt = document.createElement('option');
                opt.value = idSol;
                opt.textContent = idSol;
                select.appendChild(opt);
            });

            mostrarDetalleSolicitud();
        }

        function mostrarDetalleSolicitud() {
            const select = document.getElementById('selectSolicitud');
            const solId = select.value;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (!solId || !agrupadosPorSolicitud[solId]) {
                document.getElementById('usuarioTecnico').value = '-';
                document.getElementById('fechaConsulta').value = '-';
                tbody.innerHTML = '<tr><td colspan="5" class="empty-row">Selecciona una solicitud</td></tr>';
                return;
            }

            const items = agrupadosPorSolicitud[solId];
            
            document.getElementById('usuarioTecnico').value = items[0].usuario;
            document.getElementById('fechaConsulta').value = items[0].fecha || '-';
            document.getElementById('badgeEstado').textContent = items[0].estado || 'Pendiente';

            items.forEach(item => {
                const row = document.createElement('tr');
                row.id = `row-item-${item.rowNum}`;
                row.innerHTML = `
                    <td>${item.codigo}</td>
                    <td>${item.descripcion}</td>
                    <td style="text-align: center;">${item.cantidad}</td>
                    <td style="text-align: center;">
                        <input type="number" class="input-authorized" id="qty-${item.rowNum}" data-rownum="${item.rowNum}" value="${item.cantidad}" min="1">
                    </td>
                    <td style="text-align: center;">
                        <button class="btn-sm-danger" onclick="eliminarItemRow(${item.rowNum})" title="Eliminar ítem">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function eliminarItemRow(rowNum) {
            if (!confirm('¿Deseas eliminar este ítem del pedido?')) return;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'eliminarItem',
                    rowNum: parseInt(rowNum) // Aseguramos que sea entero
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    const tr = document.getElementById(`row-item-${rowNum}`);
                    if (tr) tr.remove();
                    
                    if (document.querySelectorAll('#tableBody tr').length === 0) {
                        cargarPedidos();
                    }
                } else {
                    alert('Error al eliminar: ' + data.message);
                }
            })
            .catch(err => alert('Error de red al procesar la solicitud.'));
        }

        function autorizarPedidoActual() {
            const select = document.getElementById('selectSolicitud');
            const idSolicitud = select.value;

            if (!idSolicitud) {
                alert('No hay ninguna solicitud seleccionada.');
                return;
            }

            const inputs = document.querySelectorAll('.input-authorized');
            let modificaciones = [];

            inputs.forEach(input => {
                modificaciones.push({
                    // CRÍTICO: Convertimos los strings a números antes de enviar
                    rowNum: parseInt(input.getAttribute('data-rownum')),
                    nuevaCantidad: Number(input.value)
                });
            });

            if (!confirm(`¿Confirmas la autorización de la solicitud #${idSolicitud}?`)) return;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'autorizarPedido',
                    numPedido: idSolicitud, // Enviado como identificador (puede ser texto o número, el backend lo maneja)
                    modificaciones: modificaciones
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                // Ahora sí verificamos que Apps Script no haya arrojado un error interno
                if (data.status === 'success') {
                    alert('✅ Solicitud autorizada exitosamente. El técnico ha sido notificado.');
                    cargarPedidos();
                } else {
                    alert('❌ Error del servidor: ' + data.message);
                    console.error(data.message);
                }
            })
            .catch(err => {
                alert('Error de conexión al autorizar el pedido.');
                console.error(err);
            });
        }

        function anularPedidoActual() {
            const select = document.getElementById('selectSolicitud');
            const idSolicitud = select.value;

            if (!idSolicitud) {
                alert('No hay ninguna solicitud seleccionada.');
                return;
            }

            if (!confirm(`¿Deseas ANULAR completamente la solicitud #${idSolicitud}?`)) return;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'anularPedido',
                    numPedido: idSolicitud
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('🚫 Solicitud anulada. El técnico ha sido notificado.');
                    cargarPedidos();
                } else {
                    alert('❌ Error del servidor: ' + data.message);
                }
            })
            .catch(err => alert('Error de conexión al anular el pedido.'));
        }
    </script>
</body>
</html>
