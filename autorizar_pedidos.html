<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Autorizar Pedidos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #4A90E2; color: white; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-auth { background-color: #2ecc71; }
        .btn-del { background-color: #e74c3c; }
        .input-qty { width: 60px; padding: 4px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Listado de Pedidos Pendientes</h2>
        <button class="btn" style="background:#333;" onclick="window.location.href='dashboard.html'">Volver al Dashboard</button>
    </div>
    
    <div id="loading">Cargando pedidos...</div>

    <table id="tablaPedidos" style="display:none;">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Solicitud/Pedido</th>
                <th>Código</th>
                <th>Descripción</th>
                <th>Cantidad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
    </table>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJmtoTOULHHnbKTJDSk2cSwZtQRur-_fwH8jGVRbutl_qlP4ZtRjguIujsYNtnv-YVmw/exec';

        document.addEventListener('DOMContentLoaded', cargarPedidos);

        function cargarPedidos() {
            const usuarioLogueado = localStorage.getItem('usuarioLogueado');
            if (!usuarioLogueado) { window.location.href = 'login.html'; return; }

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'getPedidosPendientes', usuarioLogueado: usuarioLogueado })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if (data.status === 'success' && data.pedidos.length > 0) {
                    renderTable(data.pedidos);
                } else {
                    document.getElementById('loading').style.display = 'block';
                    document.getElementById('loading').innerText = "No hay pedidos pendientes.";
                }
            })
            .catch(err => alert("Error cargando pedidos."));
        }

        function renderTable(pedidos) {
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';
            document.getElementById('tablaPedidos').style.display = 'table';

            pedidos.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.fecha}</td>
                    <td>${p.usuario}</td>
                    <td>${p.solicitud || p.pedido}</td>
                    <td>${p.codigo}</td>
                    <td>${p.descripcion}</td>
                    <td><input type="number" class="input-qty" id="cant_${p.rowNum}" value="${p.cantidad}"></td>
                    <td>
                        <button class="btn btn-auth" onclick="autorizarItem(${p.rowNum})">Autorizar</button>
                        <button class="btn btn-del" onclick="eliminarItem(${p.rowNum})">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function autorizarItem(rowNum) {
            const nuevaCant = document.getElementById(`cant_${rowNum}`).value;
            ejecutarAccion({
                action: 'autorizarPedido',
                modificaciones: [{ rowNum: rowNum, nuevaCantidad: nuevaCant }]
            });
        }

        function eliminarItem(rowNum) {
            if(confirm("¿Seguro que deseas eliminar este ítem?")) {
                ejecutarAccion({ action: 'eliminarItem', rowNum: rowNum });
            }
        }

        function ejecutarAccion(payload) {
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert("Acción realizada con éxito.");
                    location.reload(); // Recarga la tabla para reflejar cambios
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(err => alert("Error de red al ejecutar acción."));
        }
    </script>
</body>
</html>
