<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <style>
        :root { --primary-color: #4A90E2; --background-color: #f4f7f6; --text-color: #333; --input-border: #ccc; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--background-color); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background-color: white; padding: 40px; border-radius: 10px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 30px; color: var(--text-color); }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--input-border); border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        .form-group input:focus { border-color: var(--primary-color); outline: none; }
        .password-container { position: relative; }
        .toggle-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 14px; color: #666; padding: 5px; }
        .btn-submit { width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background-color: #357abd; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Bienvenido</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Usuario / Correo Electrónico</label>
                <input type="text" id="email" required placeholder="Usuario o correo">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-container">
                    <input type="password" id="password" required placeholder="Ingresa tu contraseña">
                    <button type="button" id="togglePassword" class="toggle-btn">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJmtoTOULHHnbKTJDSk2cSwZtQRur-_fwH8jGVRbutl_qlP4ZtRjguIujsYNtnv-YVmw/exec'; 

        // Mostrar/Ocultar contraseña
        const pwdInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        toggleBtn.addEventListener('mousedown', () => pwdInput.type = 'text');
        toggleBtn.addEventListener('mouseup', () => pwdInput.type = 'password');
        toggleBtn.addEventListener('mouseleave', () => pwdInput.type = 'password');

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.querySelector('.btn-submit');
            btn.textContent = 'Verificando...';
            btn.disabled = true;

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'login',
                    email: document.getElementById('email').value,
                    password: pwdInput.value
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    localStorage.setItem('sesionIniciada', 'true');
                    localStorage.setItem('userName', data.nombre);
                    localStorage.setItem('userRole', data.rol);
                    localStorage.setItem('usuarioLogueado', data.usuario);
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Error: ' + data.message);
                    btn.textContent = 'Iniciar Sesión';
                    btn.disabled = false;
                }
            })
            .catch(err => {
                alert('Error de conexión');
                btn.textContent = 'Iniciar Sesión';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
