<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --background-color: #f4f7f6;
            --text-color: #333;
            --input-border: #ccc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .password-container {
            position: relative;
        }

        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            user-select: none;
            padding: 5px;
        }

        .toggle-btn:hover {
            color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Bienvenido</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Usuario / Correo Electrónico</label>
                <!-- Cambio a type="text" para permitir nombres de usuario (ej. rgalvarez) o correo -->
                <input type="text" id="email" name="email" required placeholder="Usuario o correo">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                    <button type="button" id="togglePassword" class="toggle-btn" title="Mantén presionado para ver">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        // --- Lógica del botón de ver contraseña ---
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');

        togglePasswordBtn.addEventListener('mousedown', () => passwordInput.type = 'text');
        togglePasswordBtn.addEventListener('mouseup', () => passwordInput.type = 'password');
        togglePasswordBtn.addEventListener('mouseleave', () => passwordInput.type = 'password');
        togglePasswordBtn.addEventListener('touchstart', (e) => { e.preventDefault(); passwordInput.type = 'text'; });
        togglePasswordBtn.addEventListener('touchend', (e) => { e.preventDefault(); passwordInput.type = 'password'; });

        // --- Lógica de Inicio de Sesión con Google Apps Script ---
        const loginForm = document.getElementById('loginForm');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxJmtoTOULHHnbKTJDSk2cSwZtQRur-_fwH8jGVRbutl_qlP4ZtRjguIujsYNtnv-YVmw/exec'; 

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.querySelector('.btn-submit');
            
            submitBtn.textContent = 'Verificando...';
            submitBtn.disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'login',
                    email: email,
                    password: password
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    // Guardar datos del usuario para el Dashboard
                    localStorage.setItem('sesionIniciada', 'true');
                    localStorage.setItem('userName', data.nombre);
                    localStorage.setItem('userRole', data.rol);
                    localStorage.setItem('userEmail', data.correo);
                    localStorage.setItem('usuarioLogueado', data.usuario);
                    
                    // Redirigir al Dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Acceso denegado: ' + data.message);
                    submitBtn.textContent = 'Iniciar Sesión';
                    submitBtn.disabled = false;
                }
            })
            .catch(err => {
                console.error(err);
                alert('Error de conexión con el servidor.');
                submitBtn.textContent = 'Iniciar Sesión';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
