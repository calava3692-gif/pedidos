<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --background-color: #f4f7f6;
            --text-color: #333;
            --input-border: #ccc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .password-container {
            position: relative;
        }

        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            user-select: none;
            padding: 5px;
        }

        .toggle-btn:hover {
            color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Bienvenido</h2>
        <form id="loginForm" action="/login" method="POST">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu@correo.com">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                    <button type="button" id="togglePassword" class="toggle-btn" title="Mantén presionado para ver">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');

        // Mostrar contraseña al mantener presionado
        togglePasswordBtn.addEventListener('mousedown', function() {
            passwordInput.type = 'text';
        });

        // Ocultar contraseña al soltar el clic
        togglePasswordBtn.addEventListener('mouseup', function() {
            passwordInput.type = 'password';
        });

        // Ocultar contraseña si el cursor sale del botón mientras se presiona
        togglePasswordBtn.addEventListener('mouseleave', function() {
            passwordInput.type = 'password';
        });
        
        // Soporte para pantallas táctiles (móviles)
        togglePasswordBtn.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Evita comportamientos indeseados del navegador
            passwordInput.type = 'text';
        });
        
        togglePasswordBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            passwordInput.type = 'password';
        });
    </script>
</body>
</html>
