<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; }
        .navbar { background-color: #333; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .user-info { font-weight: bold; }
        .user-role { font-size: 0.85em; color: #ccc; margin-left: 10px; }
        .btn-logout { background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .container { padding: 40px; text-align: center; }
        .menu-card { display: inline-block; background: white; padding: 20px 40px; margin: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-decoration: none; color: #333; font-weight: bold; border: 1px solid #ddd; }
        .menu-card:hover { border-color: #4A90E2; color: #4A90E2; }
    </style>
</head>
<body>
    <div class="navbar">
        <div>Sistema de Pedidos</div>
        <div>
            <span class="user-info" id="userNameDisplay">Usuario</span>
            <span class="user-role" id="userRoleDisplay">(Rol)</span>
            <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
        </div>
    </div>

    <div class="container">
        <h1>Bienvenido al Panel de Control</h1>
        <a href="autorizar_pedidos.html" class="menu-card">📝 Autorizar Pedidos</a>
        <!-- Puedes agregar más módulos aquí -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('sesionIniciada') !== 'true') {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('userNameDisplay').innerText = localStorage.getItem('userName') || '';
            document.getElementById('userRoleDisplay').innerText = `(${localStorage.getItem('userRole') || ''})`;
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
